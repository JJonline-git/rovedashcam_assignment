# Distro policy for the ISP assignment. Selected by "distro: isp" in the kas file.
# Everything that shapes the TARGET lives here (not in local.conf).
require conf/distro/poky.conf

DISTRO = "isp"
DISTRO_NAME = "ISP Assignment (Poky based)"

# systemd as init: needed for our service unit and journalctl logs.
INIT_MANAGER = "systemd"

# Headless camera appliance: drop graphics stacks we never use.
# This also stops GStreamer from pulling in Mesa/GL, which saves hours of build time.
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan ptest"

# --- Raspberry Pi specific (":rpi" override = only applies to meta-raspberrypi machines) ---
# meta-raspberrypi ships imx219/imx477/imx708 overlays but not ov5647.
# Our camera (Sunny P5V04A) is an OV5647, so the overlay must be deployed to /boot/overlays.
KERNEL_DEVICETREE:append:rpi = " overlays/ov5647.dtbo"
