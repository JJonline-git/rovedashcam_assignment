# Tell BitBake where this layer's config and recipes live.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "isp-assignment"
BBFILE_PATTERN_isp-assignment = "^${LAYERDIR}/"
# Higher than poky (5) and meta-raspberrypi (9) so our bbappends/settings win.
BBFILE_PRIORITY_isp-assignment = "10"

# core = poky/meta, multimedia-layer = libcamera recipe, openembedded-layer = meta-oe.
# meta-raspberrypi is NOT a hard dependency: the layer can build for other machines.
LAYERDEPENDS_isp-assignment = "core openembedded-layer multimedia-layer"
LAYERSERIES_COMPAT_isp-assignment = "scarthgap"
